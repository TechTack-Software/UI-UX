<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wedding Booking | Jai Events</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="D:\internship\jai_events_file\logo.png">
</head>
<body>
    <div class="glass-card form-container">
        <h2 style="color:var(--gold); margin-bottom: 20px;">Wedding Hall Booking</h2>
        <form action="payment.html">
            <input type="text" placeholder="Full Name" required>
            <input type="tel" placeholder="Phone Number" required>
            <input type="email" placeholder="Email Address" required>
            <input type="date" placeholder="Event Date" required>
            <input type="number" placeholder="Number of Guests" required>
            <select>
                <option>Grand Ballroom</option>
                <option>Garden Pavilion</option>
            </select>
            <textarea placeholder="Additional Requirements"></textarea>
            <button type="submit" class="btn-book" style="border:none; width:100%; cursor:pointer;">Proceed to Payment</button>
        </form>
    </div>
</body>
</html>
