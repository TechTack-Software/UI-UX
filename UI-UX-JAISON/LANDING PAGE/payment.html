<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Jai Events</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="D:\internship\jai_events_file\logo.png">
    <style>
        .payment-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .upi-section {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Jai Events</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <div class="glass-card">
            <h2 style="color:var(--gold); text-align:center; margin-bottom:20px;">Secure Checkout</h2>
            
            <div class="payment-card">
                <p style="font-size: 0.8rem; opacity: 0.7;">Card Member</p>
                <p style="font-size: 1.2rem; margin-bottom: 15px;">Jai Events Premium</p>
                <p>**** **** **** 2026</p>
            </div>

            <form id="paymentForm">
                <input type="text" placeholder="Cardholder Name" required>
                <input type="text" placeholder="Card Number" maxlength="16" required>
                <div style="display:flex; gap:10px;">
                    <input type="text" placeholder="MM/YY" required>
                    <input type="password" placeholder="CVV" maxlength="3" required>
                </div>

                <div class="upi-section">
                    <p style="color:var(--neon-cyan)">- OR USE UPI -</p>
                    <input type="text" placeholder="Enter UPI ID (e.g. user@upi)">
                </div>

                <button type="submit" class="btn-book" style="width:100%; border:none; cursor:pointer; margin-top:10px;">Pay Now</button>
            </form>
        </div>
    </div>

    <!-- Success Message (Hidden by default) -->
    <div id="successOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-dark); z-index:2000; justify-content:center; align-items:center; flex-direction:column; text-align:center;">
        <h1 style="color:var(--neon-cyan); font-size:3rem; margin-bottom:20px;">Booking Successful!</h1>
        <p style="color:var(--ivory); font-size:1.2rem;">Welcome to the Jai Events family. Your celebration starts now.</p>
        <a href="index.html" class="btn-book" style="margin-top:30px;">Return Home</a>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('successOverlay').style.display = 'flex';
        });
    </script>
</body>
</html>
