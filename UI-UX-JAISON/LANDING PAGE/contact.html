<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Jai Events</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="D:\internship\jai_events_file\logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 100px 50px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .info-item {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .social-btns {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--neon-cyan);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            text-decoration: none;
        }
        .social-icon:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: scale(1.1);
        }
        @media (max-width: 668px) {
            .contact-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo-container">
    <img src="D:\internship\jai_events_file\logo.png" alt="Logo" class="round-logo">
    <span class="brand-name">JAI EVENTS</span>
  </div>
    
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="contact-wrapper">
        <div class="contact-info">
            <h1 style="color:var(--gold); margin-bottom:20px;">Get in Touch</h1>
            <p style="margin-bottom:40px;">Have a vision for your next big event? Let's make it a reality.</p>
            
            <div class="info-item">
                <i class="fas fa-phone" style="color:var(--neon-cyan)"></i>
                <span>+91 98765 43210</span>
            </div>
            <div class="info-item">
                <i class="fas fa-envelope" style="color:var(--neon-cyan)"></i>
                <span>hello@jaievents.com</span>
            </div>
            <div class="info-item">
                <i class="fas fa-map-marker-alt" style="color:var(--neon-cyan)"></i>
                <span>Ellis Nagar, Madurai, TN</span>
            </div>

            <div class="social-btns">
                <a href="https://www.instagram.com/accounts/login/?hl=en" class="social-icon"><i class="fab fa-instagram"></i></a>
                <a href="https://www.facebook.com/login/?next=https%3A%2F%2Fwww.facebook.com%2F" class="social-icon"><i class="fab fa-facebook"></i></a>
                <a href="https://whatsapp.com/" class="social-icon"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>

        <div class="glass-card">
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Email Address" required>
                <textarea rows="5" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn-book" style="width:100%; border:none; cursor:pointer;">Send Message</button>
            </form>
            
        </div>
    </div>
    <section id="contact-section">
    <div class="contact-container">
        
        <div class="contact-left">
            <div class="vcard-container">
                <div class="flip-card">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="D:\internship\jai_events_file\card front.png.png" alt="Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="D:\internship\jai_events_file\card back.png.png" alt="Back">
                        </div>
                    </div>
                </div>
                <p class="flip-hint">Hover to flip 🔄</p>
            </div>
        </div>

        <div class="contact-right">
            <iframe 
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15721.432616231923!2d78.102377!3d9.9040989!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b00c58730d98ccf%3A0xdd8025cf05822194!2sEllis%20Nagar%2C%20Madurai%2C%20Tamil%20Nadu!5e0!3m2!1sen!2sin!4v1715767500000!5m2!1sen!2sin" 
    width="100%" 
    height="250" 
    style="border:0; border-radius: 15px;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="no-referrer-when-downgrade">
</iframe>
        </div>

    </div>
</section>
    
    <footer>© 2026 Jai Events. All Rights Reserved.</footer>
</body>
</html>
