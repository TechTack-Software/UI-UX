<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaison's Professional Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #1a2a6c;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 85%; 
            max-width: 1000px; 
            margin: 50px 0;
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box; 
        }

        
        header {
            text-align: center;
            width: 100%;
        }

        header h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            color: #1a2a6c;
        }

        .gold-line {
            border: 0;
            height: 5px;
            background: linear-gradient(to right, #b2944d, #f9d423);
            margin-bottom: 50px;
            border-radius: 5px;
        }

        
        .profile-box {
            display: flex;
            flex-wrap: nowrap; 
            align-items: center;
            gap: 50px; 
            margin-bottom: 50px;
            width: 100%;
        }

        .profile-pic {
            flex-shrink: 0; 
        }

        .profile-pic img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 6px solid #b2944d;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .details {
            flex-grow: 1;
        }

        .details h2 {
            font-size: 38px;
            color: #b2944d;
            margin: 0 0 15px 0;
        }

        .details p {
            font-size: 22px;
            line-height: 1.6;
            margin: 10px 0;
        }

        .label {
            font-weight: bold;
            color: #1a2a6c;
            width: 100px;
            display: inline-block;
        }

                h3 {
            font-size: 28px;
            border-left: 8px solid #b2944d;
            padding-left: 20px;
            margin: 40px 0 20px 0;
        }

        ul {
            padding-left: 30px;
        }

        li {
            font-size: 20px;
            padding: 8px 0;
        }

        .links-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .web-button {
            text-decoration: none;
            background: #1a2a6c;
            color: #f9d423;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
        }

        .web-button:hover {
            background: #b2944d;
            color: #1a2a6c;
            transform: scale(1.05);
        }

        
        footer {
            width: 100%;
            margin-top: auto;
            text-align: center;
            padding: 25px;
            background-color: #1a2a6c;
            color: #f9d423;
        }
    </style>
</head>
