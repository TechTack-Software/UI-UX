<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="login page final style.css">
</head>
<body>

    <div class="signup-card">
        <div class="profile-icon">👤</div>
        <h2>Create Account</h2>
        <p class="subtitle">Sign up and get started</p>

        <form>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password">
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password">
            </div>

            <div class="terms">
                <input type="checkbox"> <span>I agree to the <a href="#">Terms & Conditions</a></span>
            </div>

            <button type="submit" class="btn-signup">Sign Up</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <button class="btn-google">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18" alt="G"> 
            Sign up with Google
        </button>

        <p class="footer-text">Already have an account? <a href="#">Login</a></p>
    </div>

</body>
</html>
